name: Capture app screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant dev.androidnoise.gammaclicks android.permission.POST_NOTIFICATIONS
            adb shell am start -W -n dev.androidnoise.gammaclicks/.MainActivity
            sleep 3
            mkdir -p screenshot-output
            adb exec-out screencap -p > screenshot-output/idle.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml screenshot-output/window.xml

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshot-output/
